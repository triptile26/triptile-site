<script>
const ADMIN_PASSWORD = "junyung2010!";

let geckos = JSON.parse(localStorage.getItem('geckos')) || [];
let inquiries = JSON.parse(localStorage.getItem('inquiries')) || [];
let logoUrl = localStorage.getItem('logoUrl') || "https://i.imgur.com/2DhmtJ4.png";

function saveGeckos() {
  localStorage.setItem('geckos', JSON.stringify(geckos));
}

function saveInquiries() {
  localStorage.setItem('inquiries', JSON.stringify(inquiries));
}

function updateLogo() {
  document.getElementById('mainLogo').src = logoUrl;
}

function compressImage(file) {
  return new Promise((resolve) => {

    const reader = new FileReader();

    reader.readAsDataURL(file);

    reader.onload = (event) => {

      const img = new Image();

      img.src = event.target.result;

      img.onload = () => {

        const canvas = document.createElement('canvas');

        const maxWidth = 900;

        let width = img.width;
        let height = img.height;

        if (width > maxWidth) {
          height *= maxWidth / width;
          width = maxWidth;
        }

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext('2d');

        ctx.drawImage(img, 0, 0, width, height);

        resolve(
          canvas.toDataURL('image/jpeg', 0.7)
        );

      };

    };

  });
}

function renderGeckos() {

  const grid = document.getElementById('geckoGrid');

  grid.innerHTML = '';

  geckos.forEach((gecko, index) => {

    let slidesHTML = gecko.images.map(src => `
      <img src="${src}"
      style="display:none;width:100%;height:auto;max-height:380px;object-fit:contain;">
    `).join('');

    const card = document.createElement('div');

    card.className = 'card';

    card.innerHTML = `
      <div class="image-container" data-index="${index}">
        ${slidesHTML}

        ${gecko.images.length > 1 ? `
          <button class="slide-btn prev"
          onclick="prevSlide(${index})">←</button>

          <button class="slide-btn next"
          onclick="nextSlide(${index})">→</button>
        ` : ''}
      </div>

      <div class="card-content">

        <span class="status ${gecko.status === 'sale' ? 'sale' : 'sold'}">
          ${gecko.status === 'sale' ? '🟢 분양중' : '⚫ 분양완료'}
        </span>

        <h3>${gecko.name}</h3>

        <p class="detail">💰 ${gecko.price}</p>
        <p class="detail">⚖️ ${gecko.weight}</p>
        <p class="detail">📅 ${gecko.birth}</p>
        <p class="detail">🚹 ${gecko.gender}</p>
        <p class="detail">${gecko.desc}</p>

        ${gecko.status === 'sale' ? `

          <textarea
          id="msg-${index}"
          placeholder="문의 내용"></textarea>

          <button class="send"
          onclick="sendInquiry(${index})">
          문의 보내기
          </button>

          <button class="adopt-btn"
          onclick="showAdoptOptions(${index})">
          🐾 입양하기
          </button>

        ` : ''}

      </div>
    `;

    grid.appendChild(card);

    const firstImg = card.querySelector('img');

    if (firstImg) {
      firstImg.style.display = 'block';
    }

  });

}

let currentSlideIndex = {};

function prevSlide(i) {

  const container =
  document.querySelector(`.image-container[data-index="${i}"]`);

  const imgs = container.querySelectorAll('img');

  currentSlideIndex[i] =
  (currentSlideIndex[i] || 0) - 1;

  if (currentSlideIndex[i] < 0) {
    currentSlideIndex[i] = imgs.length - 1;
  }

  showSlide(container, currentSlideIndex[i]);

}

function nextSlide(i) {

  const container =
  document.querySelector(`.image-container[data-index="${i}"]`);

  const imgs = container.querySelectorAll('img');

  currentSlideIndex[i] =
  (currentSlideIndex[i] || 0) + 1;

  if (currentSlideIndex[i] >= imgs.length) {
    currentSlideIndex[i] = 0;
  }

  showSlide(container, currentSlideIndex[i]);

}

function showSlide(container, idx) {

  container.querySelectorAll('img').forEach((img, i) => {
    img.style.display = i === idx ? 'block' : 'none';
  });

}

function sendInquiry(index) {

  const textarea =
  document.getElementById(`msg-${index}`);

  const message = textarea.value.trim();

  if (!message) {
    alert("문의 내용을 입력해주세요.");
    return;
  }

  inquiries.unshift({
    geckoName: geckos[index].name,
    message: message,
    time: new Date().toLocaleString('ko-KR')
  });

  saveInquiries();

  textarea.value = '';

  alert("✅ 문의가 접수되었습니다!");

}

function showAdoptOptions(index) {

  const choice = prompt(
`${geckos[index].name}

1. 도도시 배송
2. 직접 방문

1 또는 2 입력`
  );

  if (choice === "1") {
    adoptDodo(index);
  }

  else if (choice === "2") {
    adoptVisit(index);
  }

}

function adoptDodo(index) {

  const phone = prompt(
`도도시 배송 신청

연락받을 전화번호 입력`
  );

  if (phone) {

    inquiries.unshift({
      type: '도도시 배송',
      geckoName: geckos[index].name,
      phone: phone,
      time: new Date().toLocaleString('ko-KR')
    });

    saveInquiries();

    alert("✅ 도도시 배송 신청 완료!");

  }

}

function adoptVisit(index) {

  const phone = prompt(
`직접 방문 신청

연락받을 전화번호 입력`
  );

  if (phone) {

    inquiries.unshift({
      type: '직접 방문',
      geckoName: geckos[index].name,
      phone: phone,
      time: new Date().toLocaleString('ko-KR')
    });

    saveInquiries();

    alert("✅ 직거래 신청 완료!");

  }

}

function adminLogin() {

  const pw = prompt("관리자 비밀번호를 입력하세요");

  if (pw === ADMIN_PASSWORD) {
    adminPanel();
  }

  else {
    alert("비밀번호가 틀렸습니다.");
  }

}

function adminPanel() {

  if(document.getElementById('adminOverlay')) return;

  let html = `
  <div id="adminOverlay"
  style="
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  z-index:9999;
  overflow:auto;
  padding:20px;
  ">

    <div style="
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:20px;
    ">

      <h2>관리자 페이지</h2>

      <button onclick="changeLogo()"
      style="
      padding:12px 20px;
      margin:5px;
      background:#333;
      color:white;
      border:none;
      border-radius:8px;
      ">
      로고 변경
      </button>

      <button onclick="addGecko()"
      style="
      padding:12px 20px;
      margin:5px;
      background:#16a34a;
      color:white;
      border:none;
      border-radius:8px;
      ">
      새 개체 등록
      </button>

      <button onclick="location.reload()"
      style="
      padding:12px 20px;
      margin:5px;
      background:#666;
      color:white;
      border:none;
      border-radius:8px;
      ">
      닫기
      </button>

      <div id="adminList" style="margin-top:30px;"></div>

    </div>

  </div>
  `;

  const div = document.createElement('div');

  div.innerHTML = html;

  document.body.appendChild(div);

  renderAdminList();

}

function renderAdminList() {

  const container =
  document.getElementById('adminList');

  let html = '<h3>등록된 개체</h3>';

  geckos.forEach((g, i) => {

    html += `
    <div style="
    border:1px solid #ddd;
    padding:15px;
    margin-bottom:15px;
    border-radius:12px;
    ">

      <strong>${g.name}</strong><br>

      <button
      onclick="toggleStatus(${i})"
      style="margin:5px 0;padding:8px 16px;">

      ${g.status === 'sale'
      ? '🟢 분양중 → ⚫ 분양완료'
      : '⚫ 분양완료 → 🟢 분양중'}

      </button>

      <button
      onclick="deleteGecko(${i})"
      style="color:red;">
      삭제
      </button>

    </div>
    `;

  });

  html += `<h3 style="margin-top:40px;">문의 목록</h3>`;

  inquiries.forEach((q) => {

    html += `
    <div style="
    border:1px solid #ddd;
    padding:15px;
    margin-top:10px;
    border-radius:12px;
    ">

    <strong>${q.geckoName}</strong><br>

    ${q.type ? `📦 ${q.type}<br>` : ''}

    ${q.phone ? `📞 ${q.phone}<br>` : ''}

    ${q.message ? `💬 ${q.message}<br>` : ''}

    🕒 ${q.time}

    </div>
    `;

  });

  container.innerHTML = html;

}

function toggleStatus(i) {

  geckos[i].status =
  geckos[i].status === 'sale'
  ? 'sold'
  : 'sale';

  saveGeckos();

  renderGeckos();

  renderAdminList();

}

async function addGecko() {

  const name = prompt("개체 이름");

  if (!name) return;

  const input = document.createElement('input');

  input.type = 'file';

  input.accept = 'image/*';

  input.multiple = true;

  input.onchange = async () => {

    const images = [];

    for (let file of input.files) {

      images.push(
        await compressImage(file)
      );

    }

    const newGecko = {

      id: Date.now(),

      name: name,

      price: prompt("가격") || "35만원",

      weight: prompt("무게") || "18g",

      birth: prompt("생년월일") || "2025-01-01",

      gender: prompt("성별") || "수컷",

      status: "sale",

      images:
      images.length > 0
      ? images
      : ["https://images.unsplash.com/photo-1549488344-cbb6c34cf08b?q=80&w=1200"],

      desc: prompt("설명") || "입문자 추천 건강한 개체"

    };

    geckos.unshift(newGecko);

    saveGeckos();

    renderGeckos();

    renderAdminList();

    alert(`✅ ${name} 등록 완료!`);

  };

  input.click();

}

function deleteGecko(i) {

  if (confirm("정말 삭제하시겠습니까?")) {

    geckos.splice(i, 1);

    saveGeckos();

    renderGeckos();

    renderAdminList();

  }

}

async function changeLogo() {

  const input = document.createElement('input');

  input.type = 'file';

  input.accept = 'image/*';

  input.onchange = async () => {

    if (input.files[0]) {

      logoUrl =
      await compressImage(input.files[0]);

      localStorage.setItem('logoUrl', logoUrl);

      updateLogo();

      alert("✅ 로고 변경 완료");

    }

  };

  input.click();

}

updateLogo();
renderGeckos();
            </script>
